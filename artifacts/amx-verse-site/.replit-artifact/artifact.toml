kind = "web"
previewPath = "/"
title = "AMX VERSE Website"
description = "A corporate website draft for AMX VERSE Private Limited, presenting its engineering capabilities, innovation work, training, projects and qualified enquiry routes."
version = "1.0.0"
id = "artifacts/amx-verse-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19678

[services.development]
run = "pnpm --filter @workspace/amx-verse-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/amx-verse-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/amx-verse-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19678"
BASE_PATH = "/"
